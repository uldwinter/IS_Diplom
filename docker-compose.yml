services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gifted_children
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gifted_children"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ./server
    environment:
      NODE_ENV: ${APP_NODE_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      TRUST_PROXY: "1"
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: gifted_children
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: .
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "80:80"
volumes:
  pgdata:
